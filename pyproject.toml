[project]
name = "uwrestore"
version = "0.1.0"
description = "Underwater image/video restoration pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
uw = "uw.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uw*"]
